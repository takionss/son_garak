<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGA Asset 웰스지점 | 내 보험 점검하기</title>
    <style>
        :root { --main-blue: #002060; --point-orange: #ff5722; --text-gray: #444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; }

        /* 랜딩 메인 레이아웃 */
        .wrapper { display: flex; flex-wrap: wrap; min-height: 100vh; }

        /* 왼쪽: 마케팅 메시지 영역 */
        .hero-section { 
            flex: 1.2; background: linear-gradient(rgba(0,32,96,0.85), rgba(0,32,96,0.85)), url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center; color: white; padding: 80px 10%; display: flex; flex-direction: column; justify-content: center;
        }
        .hero-section h1 { font-size: 3rem; font-weight: 800; margin-bottom: 25px; line-height: 1.2; word-break: keep-all; }
        .hero-section h1 span { color: #ffd700; }
        .hero-section p.main-desc { font-size: 1.3rem; margin-bottom: 40px; opacity: 0.9; word-break: keep-all; }
        
        .check-list { list-style: none; }
        .check-list li { margin-bottom: 20px; font-size: 1.15rem; display: flex; align-items: center; }
        .check-list li::before { content: '✔'; color: #ffd700; margin-right: 15px; font-weight: bold; font-size: 1.4rem; }

        /* 오른쪽: 상담 신청 폼 영역 */
        .form-section { flex: 1; min-width: 300px; padding: 40px 5%; display: flex; align-items: center; justify-content: center; }
        .consult-card { background: white; width: 100%; max-width: 480px; padding: 45px 35px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .consult-card h2 { font-size: 1.8rem; color: var(--main-blue); text-align: center; margin-bottom: 10px; letter-spacing: -1px; }
        .consult-card p.form-info { text-align: center; color: #777; font-size: 0.95rem; margin-bottom: 35px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #555; font-size: 0.9rem; }
        input, select, textarea { 
            width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; background-color: #fdfdfd; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--main-blue); outline: none; box-shadow: 0 0 0 4px rgba(0,32,96,0.05); background-color: #fff; }
        textarea { height: 100px; resize: none; }

        /* 강력한 행동 유도 버튼 */
        .submit-btn { 
            width: 100%; padding: 18px; background-color: var(--point-orange); color: white; border: none; border-radius: 10px; 
            font-size: 1.25rem; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-top: 10px;
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.3);
        }
        .submit-btn:hover { background-color: #e64a19; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 87, 34, 0.4); }
        .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }

        .privacy-notice { font-size: 11px; color: #aaa; text-align: center; margin-top: 20px; line-height: 1.4; }

        /* 모바일 대응 */
        @media (max-width: 1024px) {
            .hero-section { padding: 60px 5%; text-align: center; }
            .hero-section h1 { font-size: 2.2rem; }
            .check-list li { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <section class="hero-section">
        <p style="font-weight: bold; color: #ffd700; margin-bottom: 10px;">KGA Asset 웰스지점 전문 컨설팅</p>
        <h1>보험료는 아끼고<br><span>보장은 든든하게!</span></h1>
        <p class="main-desc">나도 모르게 새어나가는 보험료, 지점장이 직접 가입 내역을 분석하여 거품을 싹 걷어내 드립니다.</p>
        
        <ul class="check-list">
            <li>기존 보험의 중복 보장 및 불필요 특약 정리</li>
            <li>가족력이 걱정된다면? 맞춤형 집중 보장 설계</li>
            <li>지점장이 직접 제안하는 30여 개 보험사 비교</li>
        </ul>
    </section>

    <section class="form-section">
        <div class="consult-card">
            <h2>무료 상담 신청하기</h2>
            <p class="form-info">정보를 남겨주시면 영업일 기준 24시간 내 연락드립니다.</p>

            <form id="consultationForm" action="https://script.google.com/macros/s/AKfycbx-w1FcGyFXR3TR6iv2x3ImVgIMRt9lCoa-PCB6Qer38NbGP_-pJcIxlQU6jQdlokgm/exec" method="POST">
                <div class="form-group">
                    <label>성함 (필수)</label>
                    <input type="text" name="name" placeholder="성함을 입력하세요" required>
                </div>
                
                <div class="form-group">
                    <label>연락처 (필수)</label>
                    <input type="tel" name="phone" placeholder="예: 010-1234-5678" required>
                </div>
                
                <div class="form-group">
                    <label>상담 희망 분야</label>
                    <select name="category">
                        <option value="보험 리모델링/보장분석">보험 리모델링 (보장 분석)</option>
                        <option value="태아/어린이 보험">태아 및 어린이 보험</option>
                        <option value="암/실손/운전자 보험">암/실손/운전자 보험</option>
                        <option value="재무설계/연금">종합 재무 설계 및 연금</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>상세 문의내용 (선택)</label>
                    <textarea name="message" placeholder="궁금하신 점이나 상담 희망 시간을 남겨주세요"></textarea>
                </div>

                <button type="submit" class="submit-btn">지금 바로 무료 상담 신청</button>
                
                <p class="privacy-notice">
                    * 개인정보는 상담 목적으로만 사용되며 안전하게 보호됩니다.<br>
                    * 신청 후 담당 지점장이 직접 연락을 드립니다.
                </p>
            </form>
        </div>
    </section>
</div>

<script>
    const form = document.getElementById('consultationForm');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // 페이지 이동 차단

        const btn = form.querySelector('.submit-btn');
        const originalText = btn.innerText;
        
        btn.innerText = '접수 중입니다...';
        btn.disabled = true;

        fetch(form.action, {
            method: 'POST',
            body: new FormData(form)
        })
        .then(response => response.text())
        .then(data => {
            // 우리가 고생해서 만든 깔끔한 팝업창
            alert('상담 신청이 정상적으로 완료되었습니다!\n\n지점장이 내용을 확인한 후,\n빠른 시간 안에 연락드리겠습니다.');
            
            form.reset(); 
            btn.innerText = originalText;
            btn.disabled = false;
        })
        .catch(error => {
            alert('일시적인 오류가 발생했습니다. 다시 시도해 주세요.');
            btn.innerText = originalText;
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
