<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보험 정밀 팩트체크 센터</title>
    <style>
        :root { --main-dark: #0a1128; --point-blue: #0056b3; --accent-yellow: #ffc107; --bg-light: #f8f9fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: var(--main-dark); color: white; overflow-x: hidden; }

        .wrapper { display: flex; flex-wrap: wrap; min-height: 100vh; position: relative; }

        /* [Layer 1] 배경 */
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(10,17,40,0.3), rgba(10,17,40,0.5)), url('./image/bg-room.jpg') no-repeat center center;
            background-size: cover; z-index: 1;
        }

        .content-area { position: relative; z-index: 2; display: flex; flex-wrap: wrap; width: 100%; min-height: 100vh; }

        /* 왼쪽 비주얼 영역 */
        .hero-section { 
            flex: 1.6; padding: 60px 5% 60px 5%; display: flex; align-items: center; position: relative;
        }

        /* [Layer 2] 여성 전문가: 왼쪽 끝에 배치 */
        .expert-woman-layer {
            position: absolute;
            bottom: 0; left: -2%; /* 캐릭터를 왼쪽으로 살짝 더 밀어 여백 확보 */
            width: auto; height: 75%;
            max-height: 75vh;
            object-fit: contain;
            z-index: 2;
        }

        /* ✅ 문구 컨텐츠: 간격을 넓히기 위해 margin-left 상향 조정 */
        .hero-content { 
            position: relative; z-index: 3; 
            margin-left: 38%; /* 👈 28%에서 38%로 늘려 캐릭터와 거리를 두었습니다 */
            max-width: 600px;
        }

        .hero-section h1 { font-size: 3.2rem; font-weight: 800; margin-bottom: 25px; line-height: 1.3; letter-spacing: -1.5px; word-break: keep-all; }
        .hero-section h1 span { color: var(--accent-yellow); }
        .main-desc { font-size: 1.2rem; margin-bottom: 50px; opacity: 0.95; line-height: 1.7; word-break: keep-all; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        /* 혜택 아이콘 리스트 */
        .benefits-list { display: flex; flex-direction: column; gap: 20px; }
        .benefit-item { display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .benefit-icon { width: 55px; height: 55px; object-fit: contain; }
        .benefit-text h3 { font-size: 1.2rem; color: var(--accent-yellow); margin-bottom: 3px; }
        .benefit-text p { font-size: 0.95rem; color: #eee; }

        /* 오른쪽 상담 신청 폼 */
        .form-section { 
            flex: 1; min-width: 350px; padding: 40px; display: flex; align-items: center; justify-content: center; 
            background-color: var(--bg-light); z-index: 10;
        }
        .consult-card { background: white; width: 100%; max-width: 440px; padding: 45px 35px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); color: #333; }
        .consult-card h2 { color: var(--point-blue); text-align: center; margin-bottom: 35px; font-size: 1.8rem; letter-spacing: -1px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #555; }
        /* 1. 모든 입력창 공통 스타일 (기존 코드 유지) */
        input, select, textarea { 
            width: 100%; padding: 16px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 16px; 
        }
        
        /* 2. PC 버전: 문의내용(textarea) 전용 높이 설정 */
        textarea { 
            height: 150px; /* PC에서 시원하게 보이도록 */
            resize: none; 
            line-height: 1.5; 
            background: #fdfdfd;
        }
        
        /* 3. 모바일 버전: 예시 문구 안 잘리게 더 키우기 */
        @media (max-width: 1100px) {
            textarea {
                height: 220px !important; /* 모바일에서 placeholder 안 잘리게 대폭 확장 */
                padding: 20px;
            }
        }

        .submit-btn { 
            width: 100%; padding: 20px; background-color: var(--point-blue); color: white; border: none; border-radius: 12px; 
            font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background-color: #004494; transform: translateY(-2px); }

        @media (max-width: 1200px) {
            .hero-content { margin-left: 45%; } /* 중간 해상도에서도 간격 유지 */
        }

        /* 📱 모바일 버전 전용 스타일 교정 */
        @media (max-width: 1100px) {
            /* (기존 설정들...) */
            .wrapper { flex-direction: column; }
            .hero-section { padding: 60px 5%; text-align: center; justify-content: center; }
            .expert-woman-layer { display: none; }
            .hero-content { margin-left: 0; max-width: 100%; }
        
            /* ✅ 1. 아이콘 박스 내 흰색 설명 글씨 크기 축소 */
            .benefit-text p {
                font-size: 0.85rem; /* 기존 0.95rem에서 조금 더 줄여 여유를 줬습니다 */
                line-height: 1.4;
            }
        
            /* ✅ 2. 모바일 입력란(문의내용) 세로폭 확장 */
            textarea {
                height: 180px !important; /* PC보다 시원하게 180px 정도로 넓혔습니다 */
            }
        
            /* 참고: 입력란의 둥근 모서리나 여백을 모바일에 맞게 미세 조정 */
            input, select, textarea {
                padding: 14px;
                font-size: 15px; /* 모바일 키보드 팝업 시 화면 줌 현상 방지용 */
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="bg-layer"></div>

    <div class="content-area">
        <section class="hero-section">
            <img src="./image/expert-woman.png" alt="" class="expert-woman-layer">

            <div class="hero-content">
                <p style="color: var(--accent-yellow); font-weight: bold; margin-bottom: 12px; font-size: 1.1rem;">보험 정밀 팩트체크 센터</p>
                <h1>그때 가입한 보험,<br><span>지금도 당신을 지켜주나요?</span></h1>
                <p class="main-desc">나도 모르게 새어나가는 보험료, 30개 보험사 정밀 비교로 거품은 빼고 보장은 확실히 채워드립니다.</p>

                <div class="benefits-list">
                    <div class="benefit-item">
                        <img src="./image/icon-cost-down.png" class="benefit-icon">
                        <div class="benefit-text"><h3>보험료 절감</h3><p>불필요하게 낭비되는 고정 지출을 즉시 차단</p></div>
                    </div>
                    <div class="benefit-item">
                        <img src="./image/icon-analysis.png" class="benefit-icon">
                        <div class="benefit-text"><h3>보장 분석</h3><p>복잡한 약관 속 핵심 보장만 팩트체크</p></div>
                    </div>
                    <div class="benefit-item">
                        <img src="./image/icon-check.png" class="benefit-icon">
                        <div class="benefit-text"><h3>보험 점검</h3><p>전문가의 정밀 진단으로 설계의 빈틈 보완</p></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="consult-card">
                <h2>무료 진단 신청하기</h2>
                <form id="consultationForm" action="https://script.google.com/macros/s/AKfycbx-w1FcGyFXR3TR6iv2x3ImVgIMRt9lCoa-PCB6Qer38NbGP_-pJcIxlQU6jQdlokgm/exec" method="POST">
                    <div class="form-group"><label>성함 (필수)</label><input type="text" name="name" placeholder="실명을 입력해 주세요" required></div>
                    <div class="form-group"><label>연락처 (필수)</label><input type="tel" name="phone" placeholder="예: 010-1234-5678" required></div>
                    <div class="form-group">
                        <label>관심 상담 분야</label>
                        <select name="category">
                            <option value="보장분석">기존 보험 보장분석/거품제거</option>
                            <option value="신규가입">신규 보험 가입 문의</option>
                            <option value="자동차/운전자">자동차 및 운전자 보험</option>
                        </select>
                    </div>
                    <div class="form-group"><label>문의내용 (선택)</label><textarea name="message" placeholder="상담 희망 시간 등을 남겨주세요"></textarea></div>
                    <button type="submit" class="submit-btn">지금 바로 무료 진단받기</button>
                </form>
            </div>
        </section>
    </div>
</div>

<script>
    const form = document.getElementById('consultationForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = form.querySelector('.submit-btn');
        btn.innerText = '접수 중...';
        btn.disabled = true;
        fetch(form.action, { method: 'POST', body: new FormData(form) })
        .then(() => { alert('신청이 성공적으로 완료되었습니다!'); form.reset(); btn.innerText = '지금 바로 무료 진단받기'; btn.disabled = false; })
        .catch(() => { alert('오류가 발생했습니다.'); btn.disabled = false; });
    });
</script>

</body>
</html>
