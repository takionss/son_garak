<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보험 정밀 팩트체크 센터</title>
    <style>
        :root { --main-dark: #121c38; --point-blue: #0056b3; --accent-yellow: #ffc107; --bg-light: #f4f6f8; --text-gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: var(--main-dark); color: white; overflow-x: hidden; }

        .wrapper { display: flex; flex-wrap: wrap; min-height: 100vh; position: relative; }

        /* ✅ [Layer 1] 최하단 거실 배경 */
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('./image/bg-room.jpg') no-repeat center center;
            background-size: cover; z-index: 1;
        }

        /* 컨텐츠 영역 (레이어 위에 위치) */
        .content-area {
            position: relative; z-index: 2;
            display: flex; flex-wrap: wrap; width: 100%; min-height: 100vh;
        }

        /* 왼쪽 비주얼 영역 */
        .hero-section { 
            flex: 1.3; padding: 80px 8%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
            position: relative;
        }

        /* ✅ [Layer 2] 파란색 후광 (인물 바로 뒤에 배치) */
        .blue-glow-layer {
            position: absolute;
            top: 50%; left: 15%; transform: translate(-50%, -50%);
            width: 80%; height: auto; max-width: 800px;
            z-index: 1; 
            mix-blend-mode: screen; /* 검은색 날리기 */
            pointer-events: none; /* 클릭 방해 금지 */
            opacity: 0.9;
        }

        /* ✅ [Layer 3] 여성 전문가 (후광 위에 배치) */
        .expert-woman-layer {
            position: absolute;
            bottom: 0; left: 5%;
            width: auto; height: 85%;
            max-height: 90vh;
            object-fit: contain;
            z-index: 2;
        }

        /* 텍스트 및 아이콘 레이어 */
        .hero-content { position: relative; z-index: 3; }
        .hero-section h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; line-height: 1.2; letter-spacing: -1px; }
        .hero-section h1 span { color: var(--accent-yellow); }
        .main-desc { font-size: 1.3rem; margin-bottom: 50px; opacity: 0.9; max-width: 600px; word-break: keep-all; }

        /* 혜택 아이콘 배치 */
        .benefits-list { display: flex; flex-direction: column; gap: 20px; }
        .benefit-item { display: flex; align-items: center; gap: 15px; }
        .benefit-icon { width: 60px; height: 60px; object-fit: contain; }
        .benefit-text h3 { font-size: 1.2rem; color: var(--accent-yellow); }
        .benefit-text p { font-size: 0.95rem; color: #ccc; }

        /* 오른쪽 상담 신청 폼 */
        .form-section { 
            flex: 1; min-width: 320px; padding: 60px 5%; display: flex; align-items: center; justify-content: center; 
            background-color: var(--bg-light); z-index: 10;
        }
        .consult-card { background: white; width: 100%; max-width: 420px; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); color: #333; }
        .consult-card h2 { color: var(--point-blue); text-align: center; margin-bottom: 30px; font-size: 1.7rem; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 7px; font-weight: bold; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        textarea { height: 80px; resize: none; }

        .submit-btn { 
            width: 100%; padding: 18px; background-color: var(--point-blue); color: white; border: none; border-radius: 10px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { background-color: #004494; }

        /* 모바일 대응 */
        @media (max-width: 1024px) {
            .wrapper { flex-direction: column; }
            .hero-section { padding: 60px 5%; text-align: center; align-items: center; min-height: 400px; }
            .expert-woman-layer, .blue-glow-layer { display: none; } /* 모바일은 텍스트에 집중 */
            .hero-section h1 { font-size: 2.2rem; }
            .benefits-list { align-items: center; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="bg-layer"></div>

    <div class="content-area">
        <section class="hero-section">
            <img src="./image/blue-glow.jpg" alt="" class="blue-glow-layer">
            
            <img src="./image/expert-woman.png" alt="" class="expert-woman-layer">

            <div class="hero-content">
                <p style="color: var(--accent-yellow); font-weight: bold; margin-bottom: 10px;">보험 정밀 팩트체크 센터</p>
                <h1>그때 가입한 보험,<br><span>지금도 당신을 지켜주나요?</span></h1>
                <p class="main-desc">나도 모르게 새어나가는 보험료, 30개 보험사 정밀 비교로 거품은 빼고 보장은 채워드립니다.</p>

                <div class="benefits-list">
                    <div class="benefit-item">
                        <img src="./image/icon-cost-down.png" class="benefit-icon" alt="">
                        <div class="benefit-text"><h3>보험료 절감</h3><p>불필요한 지출을 즉시 막아드립니다.</p></div>
                    </div>
                    <div class="benefit-item">
                        <img src="./image/icon-analysis.png" class="benefit-icon" alt="">
                        <div class="benefit-text"><h3>보장 분석</h3><p>내 보장 내역을 꼼꼼하게 팩트체크 하세요.</p></div>
                    </div>
                    <div class="benefit-item">
                        <img src="./image/icon-check.png" class="benefit-icon" alt="">
                        <div class="benefit-text"><h3>보험 점검</h3><p>전문가의 정밀 진단으로 안심을 더하세요.</p></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="consult-card">
                <h2>무료 진단 신청</h2>
                <form id="consultationForm" action="https://script.google.com/macros/s/AKfycbx-w1FcGyFXR3TR6iv2x3ImVgIMRt9lCoa-PCB6Qer38NbGP_-pJcIxlQU6jQdlokgm/exec" method="POST">
                    <div class="form-group"><label>성함 (필수)</label><input type="text" name="name" required></div>
                    <div class="form-group"><label>연락처 (필수)</label><input type="tel" name="phone" required></div>
                    <div class="form-group">
                        <label>상담 분야</label>
                        <select name="category">
                            <option value="보장분석">기존 보험 보장분석</option>
                            <option value="신규가입">신규 보험 가입문의</option>
                            <option value="자동차/운전자">자동차/운전자 보험</option>
                        </select>
                    </div>
                    <div class="form-group"><label>문의내용</label><textarea name="message"></textarea></div>
                    <button type="submit" class="submit-btn">지금 바로 신청하기</button>
                </form>
            </div>
        </section>
    </div>
</div>

<script>
    const form = document.getElementById('consultationForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = form.querySelector('.submit-btn');
        btn.innerText = '접수 중...';
        btn.disabled = true;
        fetch(form.action, { method: 'POST', body: new FormData(form) })
        .then(() => { alert('신청이 완료되었습니다!'); form.reset(); btn.innerText = '지금 바로 신청하기'; btn.disabled = false; })
        .catch(() => { alert('오류가 발생했습니다.'); btn.disabled = false; });
    });
</script>

</body>
</html>
