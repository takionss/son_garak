<!DOCTYPE html>
<html lang="ko">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보험 정밀 팩트체크 센터</title>
    <style>
        :root { --main-dark: #121c38; --main-blue: #0056b3; --bg-light: #f4f6f8; --text-gray: #777; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: var(--main-dark); min-height: 100vh; }

        /* 전체 레이아웃 */
        .wrapper { display: flex; flex-wrap: wrap; min-height: 100vh; }

        /* 왼쪽: 비주얼 영역 (이미지 자체에 문구가 있으므로 글자 코드는 생략) */
        .hero-section { 
            flex: 1.5; 
            background: url('./image/hero-premium.png') no-repeat center center; 
            background-size: cover; 
            min-height: 400px;
        }

        /* 오른쪽: 상담 신청 폼 영역 */
        .form-section { 
            flex: 1; 
            min-width: 320px; 
            padding: 40px 5%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: var(--bg-light); 
        }
        .consult-card { 
            background: white; 
            width: 100%; 
            max-width: 420px; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }
        
        .consult-card h2 { font-size: 1.6rem; color: var(--main-blue); text-align: center; margin-bottom: 10px; letter-spacing: -1px; }
        .consult-card p.form-info { text-align: center; color: var(--text-gray); font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #444; font-size: 0.85rem; }
        input, select, textarea { 
            width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; background-color: white;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--main-blue); outline: none; }
        textarea { height: 80px; resize: none; }

        .submit-btn { 
            width: 100%; padding: 18px; background-color: var(--main-blue); color: white; border: none; border-radius: 10px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { background-color: #004494; }
        .submit-btn:disabled { background-color: #ccc; }

        .privacy-notice { font-size: 11px; color: #aaa; text-align: center; margin-top: 20px; line-height: 1.4; }

        /* 모달 스타일 */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); 
            z-index: 2000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content { 
            background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 350px; width: 100%; color: #333;
        }
        .close-modal-btn { padding: 10px 25px; background-color: var(--main-blue); color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;}

        /* 모바일 최적화 */
        @media (max-width: 1024px) {
            .wrapper { flex-direction: column; }
            .hero-section { flex: none; height: 56vw; min-height: 250px; } /* 이미지 비율 유지 */
            .form-section { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <section class="hero-section"></section>

    <section class="form-section">
        <div class="consult-card">
            <h2>무료 진단 신청하기</h2>
            <p class="form-info">정보를 남겨주시면 신속히 연락드립니다.</p>

            <form id="consultationForm" action="https://script.google.com/macros/s/AKfycbx-w1FcGyFXR3TR6iv2x3ImVgIMRt9lCoa-PCB6Qer38NbGP_-pJcIxlQU6jQdlokgm/exec" method="POST">
                <div class="form-group">
                    <label>성함 (필수)</label>
                    <input type="text" name="name" placeholder="실명을 입력해 주세요" required>
                </div>
                
                <div class="form-group">
                    <label>연락처 (필수)</label>
                    <input type="tel" name="phone" placeholder="예: 010-1234-5678" required>
                </div>
                
                <div class="form-group">
                    <label>관심 상담 분야</label>
                    <select name="category">
                        <option value="보험 보장분석/거품제거">기존 보험 보장분석/거품제거</option>
                        <option value="신규 보험 가입문의">신규 보험 가입 문의</option>
                        <option value="태아/어린이 보험">태아 및 어린이 보험</option>
                        <option value="운전자/자동차 보험 최적화">운전자 및 자동차 보험 최적화</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>상세 문의내용 (선택)</label>
                    <textarea name="message" placeholder="상담 희망 시간 등을 남겨주세요"></textarea>
                </div>

                <button type="submit" class="submit-btn">지금 바로 무료 진단받기</button>
                <p class="privacy-notice">* 개인정보는 상담 목적으로만 안전하게 사용됩니다.</p>
            </form>
        </div>
    </section>
</div>

<div class="modal-overlay" id="successModal">
    <div class="modal-content">
        <h3>신청 완료!</h3>
        <p>보험 진단 전문가가 곧 연락드리겠습니다.</p>
        <button class="close-modal-btn" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    const form = document.getElementById('consultationForm');
    const modal = document.getElementById('successModal');
    function closeModal() { modal.style.display = 'none'; form.reset(); }

    form.addEventListener('submit', function(e) {
        e.preventDefault(); 
        const btn = form.querySelector('.submit-btn');
        btn.innerText = '신청 중...';
        btn.disabled = true;

        fetch(form.action, { method: 'POST', body: new FormData(form) })
        .then(() => {
            modal.style.display = 'flex';
            btn.innerText = '지금 바로 무료 진단받기';
            btn.disabled = false;
        })
        .catch(() => {
            alert('오류가 발생했습니다. 다시 시도해 주세요.');
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
