<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 보험료 팩트체크 | 무료 맞춤 컨설팅</title>
    <style>
        /* 기본 리셋 및 폰트 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; }

        /* 랜딩 페이지 전체 화면 분할 레이아웃 */
        .landing-wrapper { display: flex; flex-wrap: wrap; min-height: 100vh; }

        /* 왼쪽: 카피라이팅 및 혜택 강조 영역 */
        .copy-section { 
            flex: 1.2; 
            background: linear-gradient(135deg, #001540, #002060); 
            color: white; 
            padding: 60px 8%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .badge { display: inline-block; background: #ffd700; color: #002060; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
        .copy-section h1 { font-size: 2.8rem; line-height: 1.3; margin-bottom: 20px; word-break: keep-all; font-weight: 800; letter-spacing: -1px; }
        .copy-section h1 span { color: #ffd700; }
        .copy-section > p { font-size: 1.2rem; line-height: 1.6; opacity: 0.9; margin-bottom: 40px; word-break: keep-all; }
        
        .benefits { list-style: none; }
        .benefits li { font-size: 1.1rem; margin-bottom: 18px; display: flex; align-items: center; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; }
        .benefits li span { font-size: 1.5rem; margin-right: 15px; }

        /* 오른쪽: 폼(DB 수집) 영역 */
        .form-section { 
            flex: 1; 
            min-width: 320px;
            padding: 40px 5%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #f4f7f6;
        }
        .form-card { 
            background: white; 
            padding: 45px 35px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 450px; 
        }
        .form-card h2 { text-align: center; color: #111; margin-bottom: 10px; font-size: 1.8rem; letter-spacing: -1px; }
        .form-card p.subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #444; font-size: 0.9rem;}
        input, select, textarea { 
            width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; 
            font-size: 15px; background-color: #fafafa; transition: all 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #002060; background-color: #fff; outline: none; box-shadow: 0 0 0 3px rgba(0,32,96,0.1); }
        textarea { height: 90px; resize: none; }
        
        /* 콜투액션(CTA) 버튼 - 눈에 확 띄는 색상 */
        button { 
            width: 100%; padding: 18px; background-color: #ff5722; color: white; 
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.3);
        }
        button:hover { background-color: #e64a19; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 87, 34, 0.4); }
        
        .privacy { font-size: 11px; color: #999; margin-top: 20px; text-align: center; line-height: 1.5; }

        /* 모바일 반응형 처리 */
        @media (max-width: 900px) {
            .copy-section { padding: 50px 20px; }
            .copy-section h1 { font-size: 2.2rem; }
            .form-section { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="landing-wrapper">
    <div class="copy-section">
        <div class="badge">KGA Asset 웰스지점 한정 혜택</div>
        <h1>매달 빠져나가는 보험료,<br><span>진짜 제대로 내고 계신가요?</span></h1>
        <p>복잡하고 어려운 보험, 지점장이 직접 가입 내역을 팩트체크하여 불필요한 지출을 막아드립니다.</p>
        
        <ul class="benefits">
            <li><span>🔍</span> 1:1 맞춤형 기존 보장 완벽 분석</li>
            <li><span>✂️</span> 중복 가입 및 불필요한 특약 리모델링</li>
            <li><span>🛡️</span> 암, 뇌, 심장 등 필수 보장 한도 점검</li>
        </ul>
    </div>

    <div class="form-section">
        <div class="form-card">
            <h2>무료 컨설팅 신청</h2>
            <p class="subtitle">지금 신청하시면 24시간 내에 연락드립니다.</p>

            <form id="consultationForm" action="https://script.google.com/macros/s/AKfycbx-w1FcGyFXR3TR6iv2x3ImVgIMRt9lCoa-PCB6Qer38NbGP_-pJcIxlQU6jQdlokgm/exec" method="POST">
                <div class="form-group">
                    <label>성함</label>
                    <input type="text" name="name" placeholder="실명을 입력해 주세요" required>
                </div>
                <div class="form-group">
                    <label>연락처</label>
                    <input type="tel" name="phone" placeholder="예: 010-1234-5678" required>
                </div>
                <div class="form-group">
                    <label>관심 분야</label>
                    <select name="category">
                        <option value="기존보험 리모델링">기존 보험 리모델링</option>
                        <option value="신규 보험 가입">신규 보험 가입 문의</option>
                        <option value="태아/어린이 보험">태아/어린이 보험</option>
                        <option value="종합 재무/연금">종합 재무 및 연금 설계</option>
                    </select>
                </div>
                <button type="submit">지금 바로 내 보험 점검하기</button>
                <p class="privacy">
                    * 입력하신 정보는 상담 목적으로만 사용되며 안전하게 보호됩니다.
                </p>
            </form>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('consultationForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = form.querySelector('button');
        const originalText = btn.innerText;
        
        btn.innerText = '신청 접수 중...';
        btn.style.backgroundColor = '#ccc';
        btn.disabled = true;

        fetch(form.action, {
            method: 'POST',
            body: new FormData(form)
        })
        .then(response => response.text())
        .then(data => {
            alert('상담 신청이 완료되었습니다.\n\n남겨주신 연락처로 곧 연락드리겠습니다!');
            form.reset(); 
            btn.innerText = originalText;
            btn.style.backgroundColor = '#ff5722';
            btn.disabled = false;
        })
        .catch(error => {
            alert('일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            btn.innerText = originalText;
            btn.style.backgroundColor = '#ff5722';
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
